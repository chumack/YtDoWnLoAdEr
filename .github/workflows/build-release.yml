name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # нужно шагу Release для создания релиза и загрузки zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (onedir)
        run: pyinstaller YtDoWnLoAdEr.spec --noconfirm --clean

      - name: Zip portable
        run: Compress-Archive -Path dist\YtDoWnLoAdEr -DestinationPath YtDoWnLoAdEr-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YtDoWnLoAdEr-portable
          path: YtDoWnLoAdEr-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YtDoWnLoAdEr-portable.zip
          body: |
            Portable-сборка YtDoWnLoAdEr для Windows (onedir).
            Распакуй zip, положи `ffmpeg.exe` рядом и запускай `YtDoWnLoAdEr.exe`.
            Full changelog: https://github.com/chumack/YtDoWnLoAdEr/commits/${{ github.ref_name }}
